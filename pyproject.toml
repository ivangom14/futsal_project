[project]
name = "futsal"
version = "0.0.1"
description = "Asistente agéntico sobre competiciones deportivas (monolito modular)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.6",
                "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1",
                "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[project.scripts]
futsal = "futsal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requiere PostgreSQL real (docker compose up -d db)"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src"]
