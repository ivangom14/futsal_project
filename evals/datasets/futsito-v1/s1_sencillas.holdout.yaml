# Futsito-Eval v1 · S1 · holdout. Formato: docs/v2/evaluation.md §3. SELLADO: no se mira para ajustar el agente.

- id: s1_posicion
  stratum: S1
  holdout: true
  requires: ["standings"]
  capability: v1
  select:
    team: {kind: "team", unique_in_snapshot: true, with: ["standings"]}
  turns:
    - user: "¿En qué posición de la clasificación está {team.name}?"
      expect:
        behavior: "answer"
        facts: [{kind: "position", value: "{team.position}", team: "{team.name}", label: "posición"}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_matches", "list_rounds", "list_teams"]}
        source: "official_table"
        max_llm_calls: 5

