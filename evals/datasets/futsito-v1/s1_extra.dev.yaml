- id: s1_extra_horario_proximo
  stratum: S1
  holdout: false
  requires: ["calendar", "match_times"]
  capability: v1
  select:
    team: {"kind": "team", "unique_in_snapshot": true, "with": ["pending"], "where": {"next_has_time": "==1"}}
  turns:
    - user: "¿A qué hora juega {team.name} su próximo partido?"
      expect:
        behavior: "answer"
        facts: [{"kind": "text_any", "any": ["{team.next_match.time}"]}]
        tools: {"needed": ["list_matches"], "allowed": ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_matches", "list_rounds", "list_teams"]}
        max_llm_calls: 5

- id: s1_extra_hora_canarias
  stratum: S1
  holdout: false
  requires: ["calendar", "match_times"]
  capability: v1
  select:
    team: {"kind": "team", "unique_in_snapshot": true, "with": ["pending"], "where": {"next_has_time": "==1"}}
  turns:
    - user: "Estoy en Canarias: ¿a qué hora empieza el próximo partido de {team.name}?"
      expect:
        behavior: "answer"
        facts: [{"kind": "text_any", "any": ["{team.next_match.time_canarias}", "{team.next_match.time}"]}]
        tools: {"needed": ["list_matches"], "allowed": ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_matches", "list_rounds", "list_teams"]}
        note: "la federación publica la hora de Madrid; en Canarias es una hora menos: vale dar la hora de Madrid o la de Canarias si lo explica"
        max_llm_calls: 5

