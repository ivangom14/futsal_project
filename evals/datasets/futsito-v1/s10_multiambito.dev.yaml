# Futsito-Eval v1 · S10 «consultas amplias / multiámbito» · dev. Formato: docs/v2/evaluation.md §3.
# `expect.v2`: conducta y hechos esperados de una arquitectura que SÍ resuelve la consulta (verdad SQL; no se califica en v1).
# En v1 (capability v2) se espera abstención honesta o aclaración, nunca un dato inventado.

- id: s10_jug_literal_silvosa
  stratum: S10
  holdout: false
  requires: ["players"]
  capability: v2
  select:
    player: {"kind": "player", "name_like": "SILVOSA"}
  turns:
    - user: "¿Sabes en qué equipo juega Pablo silvosa?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        v2: {"behavior": "answer", "facts": [{"kind": "name", "value": "{player.team}"}], "note": "v2: busca al jugador en todos los grupos y dice su equipo (verdad: player_teams.sql); pregunta literal del responsable (nombre sin orden ni mayúsculas)"}
    - user: "Creo que juega en el San Felipe Neri"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        v2: {"behavior": "answer", "facts": [{"kind": "name", "value": "{player.team}"}], "note": "v2: confirma o corrige la premisa SOLO con la evidencia del equipo; confirmar sin evidencia sería crítico"}

