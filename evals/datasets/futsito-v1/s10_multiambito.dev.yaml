- id: s10_fecha_literal_sabado_tarde
  stratum: S10
  holdout: false
  requires: ["calendar", "match_times"]
  capability: v2
  select:
    day: {"kind": "day", "date": "2026-11-07", "slot": "tarde"}
  turns:
    - user: "Dime todos los partidos que se juegan el sábado 7 de noviembre por la tarde"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        forbid_any_score: true
        v2: {"behavior": "answer", "facts": [{"kind": "number", "value": "{day.count}", "label": "partidos"}], "note": "v2: lista los partidos de TODAS las competiciones ese día (hora de Europe/Madrid) sin pedir competición; literal del responsable: el agente pidió competición"}
    - user: "De todas"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        forbid_any_score: true
        v2: {"behavior": "answer", "facts": [{"kind": "number", "value": "{day.count}", "label": "partidos"}], "note": "v2: «de todas» = todas las competiciones; responde, no vuelve a preguntar"}

