- id: s10_jug_premisa_falsa
  stratum: S10
  holdout: false
  requires: ["players"]
  capability: v2
  select:
    player: {"kind": "player", "where": {"team_count": "==1"}}
    wrong: {"kind": "team", "other_group_than": "player"}
