# Futsito-Eval v1 · S7 · holdout. Formato: docs/v2/evaluation.md §3. SELLADO: no se mira para ajustar el agente.

- id: s7_comparar_grupos_lideres
  stratum: S7
  holdout: true
  requires: ["multi_group", "standings"]
  capability: v1
  select:
    g1: {kind: "group", with: ["standings"]}
    g2: {kind: "group", with: ["standings"], other_group_than: "g1"}
  turns:
    - user: "¿Quién lidera {g1.competition} {g1.name} y quién {g2.competition} {g2.name}?"
      expect:
        behavior: "answer"
        facts: [{kind: "name", value: "{g1.leader.name}"}, {kind: "name", value: "{g2.leader.name}"}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
        max_llm_calls: 5

- id: s7_mismo_club_categorias
  stratum: S7
  holdout: true
  requires: ["multi_category", "standings"]
  capability: v1
  select:
    team: {kind: "team", with: ["standings"], diff_category: true}
  turns:
    - user: "Dame la clasificación de {team.name} en la categoría {team.category}, no en la {team.homonyms[0].category}."
      expect:
        behavior: "answer"
        facts: [{kind: "number", value: "{team.points}", label: "puntos", lenient: true}, {kind: "position", value: "{team.position}", team: "{team.name}", label: "posición"}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
        max_llm_calls: 5

- id: s7_fin_de_semana_juvenil
  stratum: S7
  holdout: true
  requires: ["calendar"]
  capability: v1
  select:
    group: {kind: "group", with: ["pending"], category: "juvenil"}
  turns:
    - user: "¿Qué partidos hay este fin de semana en {group.competition} {group.name}?"
      expect:
        behavior: "answer"
        facts: [{kind: "name", value: "{group.weekend[*].home}"}]
        tools: {needed: ["list_matches"], allowed: ["find_teams", "get_data_freshness", "list_competitions", "list_groups", "list_matches", "list_rounds", "list_teams"]}
        max_llm_calls: 5

- id: s7_mismo_nombre_grupo
  stratum: S7
  holdout: true
  requires: ["standings"]
  capability: v1
  select:
    group: {kind: "group", with: ["standings"], same_name_groups: ">=1"}
  turns:
    - user: "¿Quién va primero en {group.competition} {group.name}?"
      expect:
        behavior: "answer"
        facts: [{kind: "name", value: "{group.leader.name}"}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
        max_llm_calls: 5
