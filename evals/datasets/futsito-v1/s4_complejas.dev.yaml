- id: s4_ascenso_top3
  stratum: S4
  holdout: false
  requires: ["standings"]
  capability: v1
  select:
    group: {kind: "group", with: ["standings"], teams: ">=4"}
  turns:
    - user: "¿Qué equipos luchan por los puestos de arriba en {group.competition} {group.name}?"
      expect:
        behavior: "answer"
        facts: [{kind: "names", value: "{group.top3}", label: "tres primeros"}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
        max_llm_calls: 4

