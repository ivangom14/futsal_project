- id: s4_lider_y_goleador
  stratum: S4
  holdout: false
  requires: ["scorers", "standings"]
  capability: v1
  select:
    group: {kind: "group", with: ["standings", "scorers"]}
  turns:
    - user: "En {group.competition} {group.name}: ¿quién lidera la clasificación y quién es el máximo goleador?"
      expect:
        behavior: "answer"
        facts: [{kind: "name", value: "{group.leader.name}"}, {kind: "name", value: "{group.top_scorer.name}"}]
        tools: {needed: ["get_standings", "get_scorer_table"], allowed: ["find_teams", "get_data_freshness", "get_scorer_table", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
        max_llm_calls: 5
