- id: s4_comparar_posicion
  stratum: S4
  holdout: false
  requires: ["standings"]
  capability: v1
  select:
    a: {kind: "team", unique_in_snapshot: true, with: ["standings"]}
    b: {kind: "team", unique_in_snapshot: true, with: ["standings"], same_group_as: "a"}
  turns:
    - user: "¿En qué puesto están {a.name} y {b.name}?"
      expect:
        behavior: "answer"
        facts: [{kind: "position", value: "{a.position}", team: "{a.name}", label: "posición"}, {kind: "position", value: "{b.position}", team: "{b.name}", label: "posición"}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
        max_llm_calls: 4

