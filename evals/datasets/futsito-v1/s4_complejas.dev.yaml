# Futsito-Eval v1 · S4 · dev. Formato: docs/v2/evaluation.md §3.

- id: s4_ultimos_resultados
  stratum: S4
  holdout: false
  requires: ["results"]
  capability: v1
  select:
    team: {kind: "team", unique_in_snapshot: true, with: ["finished2"]}
  turns:
    - user: "Dame los resultados de los últimos partidos de {team.name} con su rival en cada uno."
      expect:
        behavior: "answer"
        facts: [{kind: "score", value: "{team.recent[*].score}"}, {kind: "name", value: "{team.recent[*].rival}"}]
        tools: {needed: ["list_matches"], allowed: ["find_teams", "get_data_freshness", "list_competitions", "list_groups", "list_matches", "list_rounds", "list_teams"]}
        max_llm_calls: 6

