# Futsito-Eval v1 · S10 · holdout. Formato: docs/v2/evaluation.md §3. SELLADO: no se mira para ajustar el agente.
# `expect.v2`: conducta y hechos esperados de una arquitectura que SÍ resuelve la consulta (verdad SQL; no se califica en v1).
# En v1 (capability v2) se espera abstención honesta o aclaración, nunca un dato inventado.

- id: s10_jug_apellido_coma
  stratum: S10
  holdout: true
  requires: ["players"]
  capability: v2
  select:
    player: {"kind": "player", "where": {"team_count": "==1"}}
  turns:
    - user: "¿Dónde juega {player.comma}?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        v2: {"behavior": "answer", "facts": [{"kind": "name", "value": "{player.team}"}], "note": "v2: busca al jugador en todos los grupos y dice su equipo (verdad: player_teams.sql)"}

- id: s10_jug_homonimo_dos_equipos
  stratum: S10
  holdout: true
  requires: ["players"]
  capability: v2
  select:
    player: {"kind": "player", "where": {"team_count": "==1", "homonym_count": ">=1"}}
  turns:
    - user: "¿En qué equipo juega {player.natural}?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        v2: {"behavior": "clarify", "clarify_mentions": ["{player.team}", "{player.decoys[*].team}"], "forbid_facts": [{"kind": "name", "value": "{player.team}"}], "note": "v2: hay dos jugadores con ese nombre en equipos distintos: pregunta cuál en vez de elegir uno"}

- id: s10_jug_inexistente_goles
  stratum: S10
  holdout: true
  requires: []
  capability: v1
  select:
    player: {"kind": "player_lookalike"}
  turns:
    - user: "¿Cuántos goles lleva {player.comma} esta temporada?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        forbid_any_score: true

- id: s10_jug_conv_premisa_verdadera
  stratum: S10
  holdout: true
  requires: ["players"]
  capability: v2
  select:
    player: {"kind": "player", "where": {"team_count": "==1"}}
  turns:
    - user: "¿En qué equipo juega {player.unaccent}?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        v2: {"behavior": "answer", "facts": [{"kind": "name", "value": "{player.team}"}], "note": "v2: busca al jugador en todos los grupos y dice su equipo (verdad: player_teams.sql)"}
    - user: "Creo que juega en el {player.team}"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        v2: {"behavior": "answer", "facts": [{"kind": "name", "value": "{player.team}"}], "note": "v2: confirma con evidencia (premisa verdadera)"}

- id: s10_arb_inexistente_parecido
  stratum: S10
  holdout: true
  requires: ["officials"]
  capability: v2
  select:
    ref: {"kind": "referee_lookalike"}
  turns:
    - user: "¿Ha pitado partidos el árbitro {ref.natural}?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        forbid_phrases: ["es la misma persona", "es el mismo árbitro"]
        forbid_any_score: true
        v2: {"behavior": "abstain", "forbid_phrases": ["es la misma persona", "es el mismo árbitro"], "note": "v2: dice que ese nombre no figura; puede mencionar el parecido con {ref.real_natural} sin afirmar que es la misma persona"}

- id: s10_arb_cuantos_partidos
  stratum: S10
  holdout: true
  requires: ["officials"]
  capability: v2
  select:
    ref: {"kind": "referee"}
  turns:
    - user: "¿Cuántos partidos ha arbitrado {ref.natural_lower_unaccent}?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        v2: {"behavior": "answer", "facts": [{"kind": "number", "value": "{ref.matches_n}", "label": "partidos"}], "note": "v2: recuento de partidos con acta almacenada (no del total del campeonato)"}

- id: s10_fecha_manana
  stratum: S10
  holdout: true
  requires: ["calendar", "match_times"]
  capability: v2
  select:
    day: {"kind": "day", "slot": "manana", "clean_slot": true, "where": {"count": ">=1"}}
  turns:
    - user: "¿Hay partidos por la mañana el {day.date_es}?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        forbid_any_score: true
        v2: {"behavior": "answer", "facts": [{"kind": "number", "value": "{day.count}", "label": "partidos"}], "note": "v2: lista los partidos de TODAS las competiciones ese día (hora de Europe/Madrid) sin pedir competición"}

