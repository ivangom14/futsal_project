- id: s10_fecha_futura_sin_calendario
  stratum: S10
  holdout: true
  requires: ["calendar"]
  capability: v2
  select:
    day: {"kind": "day_absent", "future": true}
  turns:
    - user: "¿Qué partidos habrá el {day.date_es}?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        forbid_any_score: true
        v2: {"behavior": "abstain", "note": "v2: no consta calendario para esa fecha; no inventa partidos"}

- id: s10_club_varias_categorias
  stratum: S10
  holdout: true
  requires: ["multi_category"]
  capability: v2
  select:
    club: {"kind": "club_multi", "where": {"categories_n": ">=2"}}
  turns:
    - user: "¿En qué categorías juega el {club.base_name}?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        v2: {"behavior": "answer", "facts": [{"kind": "names", "value": "{club.categories}"}], "note": "v2: categorías de sus equipos (por el nombre de la competición)"}

- id: s10_club_ambiguo_resultados
  stratum: S10
  holdout: true
  requires: ["standings"]
  capability: v1
  select:
    club: {"kind": "club_ambiguous"}
  turns:
    - user: "Dame los resultados del {club.token|lower}"
      expect:
        behavior: "clarify"
        clarify_mentions: ["{club.candidates[*]}"]
        max_llm_calls: 4
        note: "mismo nombre base en clubes distintos: aclaración real"

- id: s10_rank_goleador_femenino
  stratum: S10
  holdout: true
  requires: ["scorers", "scorer_ranking"]
  capability: v2
  select:
    r: {"kind": "scorer_ranking", "category": "femenino"}
  turns:
    - user: "¿Quién ha marcado más goles en todas las ligas femeninas?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        forbid_any_score: true
        v2: {"behavior": "answer", "facts": [{"kind": "name", "value": "{r.top.name}"}, {"kind": "number", "value": "{r.top.goals}", "label": "goles"}, {"kind": "text_any", "any": ["grupos distintos", "grupos diferentes", "distintos grupos", "por separado", "no son comparables", "cada grupo", "grupos independientes", "tablas distintas"]}], "note": "v2: ranking de tablas oficiales de grupos distintos"}

- id: s10_rank_racha
  stratum: S10
  holdout: true
  requires: ["standings", "results"]
  capability: v2
  select:
    r: {"kind": "team_ranking", "category": "senior", "metric": "win_streak"}
  turns:
    - user: "¿Qué equipo senior lleva más victorias seguidas?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        forbid_any_score: true
        v2: {"behavior": "answer", "facts": [{"kind": "name", "value": "{r.top.name}"}, {"kind": "number", "value": "{r.top.value}", "label": "victorias seguidas"}, {"kind": "text_any", "any": ["grupos distintos", "grupos diferentes", "distintos grupos", "por separado", "no son comparables", "cada grupo", "grupos independientes", "tablas distintas"]}], "note": "v2: ranking sobre tablas de grupos distintos (no comparables: distinto número de partidos y rivales)"}

- id: s10_rank_comparativa_femenino
  stratum: S10
  holdout: true
  requires: ["results", "multi_category"]
  capability: v2
  select:
    c: {"kind": "category_pair", "a": "femenino", "b": "senior"}
  turns:
    - user: "¿Es mayor la media de goles por partido en la liga femenina o en senior?"
      expect:
        behavior: "abstain"
        max_llm_calls: 6
        forbid_any_score: true
        v2: {"behavior": "answer", "facts": [{"kind": "name", "value": "{c.higher}"}, {"kind": "number", "value": "{c.avg_a}", "label": "goles por partido"}, {"kind": "number", "value": "{c.avg_b}", "label": "goles por partido"}], "note": "v2: comparativa entre categorías con las medias reales"}

- id: s10_aclarar_goleador_liga
  stratum: S10
  holdout: true
  requires: ["scorers", "scorer_ranking"]
  capability: v1
  select:
    r: {"kind": "scorer_ranking", "category": "senior"}
  turns:
    - user: "¿Cuál es el máximo goleador de la liga?"
      expect:
        behavior: "clarify"
        clarify_mentions: ["senior", "juvenil", "femenin"]
        max_llm_calls: 4
        note: "«la liga» no dice categoría ni grupo: aclaración real"

- id: s10_reg_cesion_portero
  stratum: S10
