# Futsito-Eval v1 · S8 · dev. Formato: docs/v2/evaluation.md §3.

- id: s8_fuera_victorias
  stratum: S8
  holdout: false
  requires: ["results"]
  capability: v1
  select:
    team: {kind: "team", unique_in_snapshot: true, with: ["finished", "away_played"], where: {away_wins: ">=1"}}
  turns:
    - user: "¿Cuántos partidos ha ganado {team.name} fuera de casa?"
      expect:
        behavior: "answer"
        facts: [{kind: "number", value: "{team.away_wins}", label: "partidos ganados fuera"}]
        tools: {needed: ["list_matches"], allowed: ["find_teams", "get_data_freshness", "list_competitions", "list_groups", "list_matches", "list_rounds", "list_teams"]}
        max_llm_calls: 5

