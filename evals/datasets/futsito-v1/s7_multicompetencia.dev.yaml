# Futsito-Eval v1 · S7 · dev. Formato: docs/v2/evaluation.md §3.

- id: s7_comparar_grupos_puntos
  stratum: S7
  holdout: false
  requires: ["multi_group", "standings"]
  capability: v1
  select:
    a: {kind: "team", unique_in_snapshot: true, with: ["standings"]}
    b: {kind: "team", unique_in_snapshot: true, with: ["standings"], other_group_than: "a"}
  turns:
    - user: "Compara a {a.name} ({a.competition} {a.group}) con {b.name} ({b.competition} {b.group}): ¿cuántos puntos tiene cada uno?"
      expect:
        behavior: "answer"
        facts: [{kind: "number", value: "{a.points}", label: "puntos {a.name}", lenient: true}, {kind: "number", value: "{b.points}", label: "puntos {b.name}", lenient: true}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
        max_llm_calls: 5

