- id: s3_cambio_categoria
  stratum: S3
  holdout: false
  requires: ["standings"]
  capability: v1
  select:
    g1: {kind: "group", with: ["standings"], category: "senior"}
    g2: {kind: "group", with: ["standings"], category: "juvenil", other_competition_than: "g1"}
  turns:
    - user: "¿Quién va primero en {g1.competition} {g1.name}?"
      expect:
        behavior: "answer"
        facts: [{kind: "name", value: "{g1.leader.name}"}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
    - user: "¿y el juvenil?"
      expect:
        behavior: "answer"
        facts: [{kind: "name", value: "{g2.leader.name}"}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
        forbid_facts: [{kind: "name", value: "{g1.leader.name}"}]
        ignore_decoys: true
    - user: "¿cuántos puntos tiene?"
      expect:
        behavior: "answer"
        facts: [{kind: "number", value: "{g2.leader.points}", label: "puntos"}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
        ignore_decoys: true

