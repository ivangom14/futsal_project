# Futsito-Eval v1 · S3 · dev. Formato: docs/v2/evaluation.md §3.

- id: s3_equipo_goleador_resultado
  stratum: S3
  holdout: false
  requires: ["results", "scorers", "standings"]
  capability: v1
  select:
    team: {kind: "team", unique_in_snapshot: true, with: ["standings", "finished", "scorers"]}
  turns:
    - user: "¿Cómo va {team.name}?"
      expect:
        behavior: "answer"
        facts: [{kind: "position", value: "{team.position}", team: "{team.name}", label: "posición"}, {kind: "number", value: "{team.points}", label: "puntos"}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
    - user: "¿y su máximo goleador?"
      expect:
        behavior: "answer"
        facts: [{kind: "name", value: "{team.top_scorer.name}"}]
        tools: {needed: ["get_scorer_table"], allowed: ["find_teams", "get_data_freshness", "get_scorer_table", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
    - user: "¿y cuál fue su último resultado?"
      expect:
        behavior: "answer"
        facts: [{kind: "score", value: "{team.last_match.score}"}]
        tools: {needed: ["list_matches"], allowed: ["find_teams", "get_data_freshness", "list_competitions", "list_groups", "list_matches", "list_rounds", "list_teams"]}

