- id: s3_aclaracion_categoria_posicion
  stratum: S3
  holdout: false
  requires: ["multi_category", "standings"]
  capability: v1
  select:
    team: {kind: "team", with: ["standings"], diff_category: true}
  turns:
    - user: "¿En qué posición está {team.name}?"
      expect:
        behavior: "clarify"
        tools: {needed: [], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_matches", "list_rounds", "list_teams"]}
        candidate_facts: [{kind: "position", value: "{team.position}", team: "{team.name}", of: "team"}]
        clarify_mentions: ["{team.category}", "{team.homonyms[*].category}"]
        max_llm_calls: 3
    - user: "El {team.category}"
      expect:
        behavior: "answer"
        facts: [{kind: "position", value: "{team.position}", team: "{team.name}", label: "posición"}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"
    - user: "¿cuántos puntos tiene?"
      expect:
        behavior: "answer"
        facts: [{kind: "number", value: "{team.points}", label: "puntos"}]
        tools: {needed: ["get_standings"], allowed: ["find_teams", "get_data_freshness", "get_standings", "list_competitions", "list_groups", "list_rounds", "list_teams"]}
        source: "official_table"

